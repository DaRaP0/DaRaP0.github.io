<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="物理词汇">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<meta name="description" content="CSCA Physics Chinese Vocabulary Flashcards">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>CSCA Physics 物理词汇</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a28;
    --border: #2a2a3e;
    --accent: #e8c547;
    --accent2: #5b8dee;
    --accent3: #e85b8d;
    --text: #e8e8f0;
    --text-dim: #888899;
    --text-muted: #555566;
    --green: #4ade80;
    --red: #f87171;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Space Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(91,141,238,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(91,141,238,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  /* HEADER */
  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-bottom: 32px;
    text-align: center;
  }

  .logo-tag {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 700;
    letter-spacing: -1px;
    background: linear-gradient(135deg, var(--text) 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 2px;
  }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .stat span {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }

  .stat.known span { color: var(--green); }
  .stat.unknown span { color: var(--red); }

  /* TOPIC FILTER */
  .topic-filter {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }

  .topic-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .topic-btn:hover {
    border-color: var(--accent2);
    color: var(--accent2);
  }

  .topic-btn.active {
    background: var(--accent2);
    border-color: var(--accent2);
    color: #fff;
  }

  /* FLASHCARD */
  .card-area {
    perspective: 1000px;
    margin-bottom: 24px;
  }

  .flashcard {
    width: 100%;
    height: 280px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }

  .flashcard.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    gap: 12px;
  }

  .card-face.back {
    transform: rotateY(180deg);
    background: linear-gradient(135deg, #1a1a28 0%, #1e1a2e 100%);
    border-color: var(--accent2);
  }

  .card-topic {
    position: absolute;
    top: 16px;
    left: 20px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .card-num {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .card-hint {
    position: absolute;
    bottom: 16px;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .card-chinese {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(36px, 7vw, 56px);
    font-weight: 700;
    color: var(--text);
    text-align: center;
    line-height: 1.2;
  }

  .card-pinyin {
    font-size: 16px;
    color: var(--accent);
    letter-spacing: 2px;
    font-weight: 400;
  }

  .card-english {
    font-size: clamp(18px, 3vw, 26px);
    color: var(--text);
    text-align: center;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .card-example {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    max-width: 400px;
    line-height: 1.6;
    font-family: 'Noto Sans SC', sans-serif;
    margin-top: 4px;
  }

  .card-formula {
    font-size: 14px;
    color: var(--accent2);
    text-align: center;
    background: rgba(91,141,238,0.1);
    padding: 6px 16px;
    border-radius: 6px;
    border: 1px solid rgba(91,141,238,0.2);
    letter-spacing: 1px;
  }

  /* CONTROLS */
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .btn {
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .btn-prev {
    background: var(--surface);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }

  .btn-prev:hover {
    border-color: var(--text-dim);
    color: var(--text);
  }

  .btn-next {
    background: var(--surface);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }

  .btn-next:hover {
    border-color: var(--text-dim);
    color: var(--text);
  }

  .btn-known {
    background: var(--green);
    color: #0a0f0a;
  }

  .btn-known:hover { opacity: 0.85; transform: translateY(-1px); }

  .btn-unknown {
    background: var(--red);
    color: #0f0a0a;
  }

  .btn-unknown:hover { opacity: 0.85; transform: translateY(-1px); }

  .btn-shuffle {
    background: var(--accent);
    color: #0f0a00;
  }

  .btn-shuffle:hover { opacity: 0.85; }

  /* PROGRESS BAR */
  .progress-wrap {
    background: var(--surface);
    border-radius: 4px;
    height: 4px;
    margin-bottom: 28px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  /* VOCAB LIST */
  .list-toggle {
    text-align: center;
    margin-bottom: 20px;
  }

  .btn-list {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 8px 20px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }

  .btn-list:hover {
    border-color: var(--accent2);
    color: var(--accent2);
  }

  .vocab-list {
    display: none;
    flex-direction: column;
    gap: 2px;
  }

  .vocab-list.visible {
    display: flex;
  }

  .vocab-section-title {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    padding: 16px 0 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }

  .vocab-row {
    display: grid;
    grid-template-columns: 120px 160px 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    border-radius: 8px;
    transition: background 0.15s;
    font-size: 13px;
  }

  .vocab-row:hover {
    background: var(--surface);
  }

  .vocab-row .zh {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }

  .vocab-row .py {
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 1px;
  }

  .vocab-row .en {
    color: var(--text-dim);
    font-size: 12px;
  }

  .vocab-row .known-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
  }

  .vocab-row .known-dot.yes {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
  }

  @media (max-width: 600px) {
    .vocab-row {
      grid-template-columns: 100px 1fr auto;
    }
    .vocab-row .py { display: none; }
  }

  /* FORMULA SHEET */
  .formula-toggle {
    text-align: center;
    margin-bottom: 20px;
  }
  .btn-formula {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 8px;
    padding: 8px 20px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .btn-formula:hover { background: rgba(232,197,71,0.1); }
  .formula-sheet {
    display: none;
    flex-direction: column;
    gap: 24px;
    margin-bottom: 40px;
  }
  .formula-sheet.visible { display: flex; }
  .formula-topic-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .formula-topic-header {
    background: rgba(91,141,238,0.08);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
  }
  .formula-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  @media (max-width: 600px) { .formula-grid { grid-template-columns: 1fr; } }
  .formula-item {
    padding: 12px 20px;
    border-bottom: 1px solid rgba(42,42,62,0.5);
    border-right: 1px solid rgba(42,42,62,0.5);
  }
  .formula-item:nth-child(even) { border-right: none; }
  .formula-name { font-family: 'Noto Sans SC', sans-serif; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .formula-eq { font-size: 13px; color: var(--accent2); letter-spacing: 0.5px; font-weight: 700; }
  .formula-note { font-size: 10px; color: var(--text-muted); margin-top: 3px; font-family: 'Noto Sans SC', sans-serif; }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo-tag">CSCA 物理</div>
    <h1>Physics Vocabulary</h1>
    <div class="subtitle">高中物理 · Chinese Exam Prep · All Topics</div>
  </header>

  <div class="stats-bar" id="statsBar">
    <div class="stat"><span id="totalCount">0</span> total</div>
    <div class="stat known"><span id="knownCount">0</span> known ✓</div>
    <div class="stat unknown"><span id="unknownCount">0</span> to review</div>
    <div class="stat"><span id="topicLabel">All</span> topic</div>
  </div>

  <div class="topic-filter" id="topicFilter"></div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>

  <div class="card-area">
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="card-face front" id="cardFront">
        <div class="card-topic" id="cardTopic">—</div>
        <div class="card-num" id="cardNum">0/0</div>
        <div class="card-chinese" id="cardChinese">—</div>
        <div class="card-pinyin" id="cardPinyin">—</div>
        <div class="card-hint">click to reveal →</div>
      </div>
      <div class="card-face back" id="cardBack">
        <div class="card-topic" id="cardTopicBack">—</div>
        <div class="card-english" id="cardEnglish">—</div>
        <div class="card-formula" id="cardFormula" style="display:none"></div>
        <div class="card-example" id="cardExample">—</div>
        <div class="card-hint">click to flip back ←</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-prev" onclick="prevCard()">← Prev</button>
    <button class="btn btn-unknown" onclick="markUnknown()">✗ Review</button>
    <button class="btn btn-known" onclick="markKnown()">✓ Known</button>
    <button class="btn btn-next" onclick="nextCard()">Next →</button>
    <button class="btn btn-shuffle" onclick="shuffleDeck()">⇌ Shuffle</button>
  </div>

  <div class="list-toggle">
    <button class="btn-list" onclick="toggleList()">Show Full Vocabulary List ↓</button>
  </div>

  <div class="vocab-list" id="vocabList"></div>

  <div class="formula-toggle">
    <button class="btn-formula" onclick="toggleFormulas()">Show Formula Sheet ↓</button>
  </div>

  <div class="formula-sheet" id="formulaSheet"></div>

</div>

<script>
const ALL_VOCAB = [
  // ── KINEMATICS 运动学 ──
  { zh:"位移", py:"wèi yí", en:"Displacement", topic:"Kinematics", formula:"Δx = x₂ - x₁", ex:"物体从A移到B的位移是矢量。" },
  { zh:"速度", py:"sù dù", en:"Velocity", topic:"Kinematics", formula:"v = Δx/Δt", ex:"速度是位移随时间的变化率。" },
  { zh:"速率", py:"sù lǜ", en:"Speed", topic:"Kinematics", formula:"", ex:"速率是速度的大小，是标量。" },
  { zh:"加速度", py:"jiā sù dù", en:"Acceleration", topic:"Kinematics", formula:"a = Δv/Δt", ex:"加速度是速度随时间的变化率。" },
  { zh:"匀速运动", py:"yún sù yùn dòng", en:"Uniform Motion", topic:"Kinematics", formula:"v = const", ex:"匀速直线运动中加速度为零。" },
  { zh:"匀加速运动", py:"yún jiā sù yùn dòng", en:"Uniformly Accelerated Motion", topic:"Kinematics", formula:"v = v₀ + at", ex:"自由落体是匀加速运动。" },
  { zh:"自由落体", py:"zì yóu luò tǐ", en:"Free Fall", topic:"Kinematics", formula:"v = gt, h = ½gt²", ex:"忽略空气阻力时物体做自由落体运动。" },
  { zh:"抛体运动", py:"pāo tǐ yùn dòng", en:"Projectile Motion", topic:"Kinematics", formula:"x=v₀t, y=½gt²", ex:"抛体运动可以分解为水平和竖直方向。" },
  { zh:"参考系", py:"cān kǎo xì", en:"Reference Frame", topic:"Kinematics", formula:"", ex:"运动是相对参考系而言的。" },
  { zh:"相对运动", py:"xiāng duì yùn dòng", en:"Relative Motion", topic:"Kinematics", formula:"v_AB = v_A - v_B", ex:"两车相向而行时相对速度较大。" },
  { zh:"轨迹", py:"guǐ jì", en:"Trajectory", topic:"Kinematics", formula:"", ex:"抛体运动的轨迹是抛物线。" },
  { zh:"位移-时间图", py:"wèi yí shí jiān tú", en:"Displacement-Time Graph", topic:"Kinematics", formula:"slope = v", ex:"斜率代表速度。" },
  { zh:"速度-时间图", py:"sù dù shí jiān tú", en:"Velocity-Time Graph", topic:"Kinematics", formula:"slope = a", ex:"斜率代表加速度，面积代表位移。" },

  // ── NEWTON'S LAWS 牛顿定律 ──
  { zh:"惯性", py:"guàn xìng", en:"Inertia", topic:"Newton's Laws", formula:"", ex:"质量越大，惯性越大。" },
  { zh:"力", py:"lì", en:"Force", topic:"Newton's Laws", formula:"F = ma", ex:"力是物体间的相互作用。" },
  { zh:"合力", py:"hé lì", en:"Net Force / Resultant Force", topic:"Newton's Laws", formula:"F_net = Σ F", ex:"合力是所有力的矢量和。" },
  { zh:"摩擦力", py:"mó cā lì", en:"Friction Force", topic:"Newton's Laws", formula:"f = μN", ex:"动摩擦力与正压力成正比。" },
  { zh:"正压力", py:"zhèng yā lì", en:"Normal Force", topic:"Newton's Laws", formula:"N = mg cosθ", ex:"正压力垂直于接触面。" },
  { zh:"重力", py:"zhòng lì", en:"Gravity (Weight)", topic:"Newton's Laws", formula:"G = mg", ex:"重力向下，大小等于mg。" },
  { zh:"张力", py:"zhāng lì", en:"Tension", topic:"Newton's Laws", formula:"T = F", ex:"绳子传递张力。" },
  { zh:"作用力与反作用力", py:"zuò yòng lì yǔ fǎn zuò yòng lì", en:"Action & Reaction", topic:"Newton's Laws", formula:"F₁₂ = -F₂₁", ex:"牛顿第三定律：力总是成对出现。" },
  { zh:"平衡", py:"píng héng", en:"Equilibrium", topic:"Newton's Laws", formula:"ΣF = 0", ex:"静止物体处于受力平衡状态。" },
  { zh:"自由体图", py:"zì yóu tǐ tú", en:"Free Body Diagram", topic:"Newton's Laws", formula:"", ex:"用自由体图分析受力情况。" },
  { zh:"质量", py:"zhì liàng", en:"Mass", topic:"Newton's Laws", formula:"m = F/a", ex:"质量是惯性的量度。" },

  // ── WORK, ENERGY & POWER 功、能、功率 ──
  { zh:"功", py:"gōng", en:"Work", topic:"Energy", formula:"W = Fd cosθ", ex:"力与位移方向相同时做正功。" },
  { zh:"动能", py:"dòng néng", en:"Kinetic Energy", topic:"Energy", formula:"Eₖ = ½mv²", ex:"运动的物体具有动能。" },
  { zh:"势能", py:"shì néng", en:"Potential Energy", topic:"Energy", formula:"Ep = mgh", ex:"重力势能与高度成正比。" },
  { zh:"机械能", py:"jī xiè néng", en:"Mechanical Energy", topic:"Energy", formula:"E = Eₖ + Ep", ex:"无摩擦时机械能守恒。" },
  { zh:"功率", py:"gōng lǜ", en:"Power", topic:"Energy", formula:"P = W/t = Fv", ex:"功率是做功的快慢。" },
  { zh:"能量守恒", py:"néng liàng shǒu héng", en:"Conservation of Energy", topic:"Energy", formula:"E_total = const", ex:"能量既不能被创造也不能被消灭。" },
  { zh:"功能定理", py:"gōng néng dìng lǐ", en:"Work-Energy Theorem", topic:"Energy", formula:"W_net = ΔEₖ", ex:"合外力做的功等于动能变化。" },
  { zh:"效率", py:"xiào lǜ", en:"Efficiency", topic:"Energy", formula:"η = W_useful/W_total", ex:"效率总是小于100%。" },
  { zh:"弹性势能", py:"tán xìng shì néng", en:"Elastic Potential Energy", topic:"Energy", formula:"E = ½kx²", ex:"弹簧压缩时储存弹性势能。" },

  // ── MOMENTUM 动量 ──
  { zh:"动量", py:"dòng liàng", en:"Momentum", topic:"Momentum", formula:"p = mv", ex:"动量是矢量，方向与速度相同。" },
  { zh:"冲量", py:"chōng liàng", en:"Impulse", topic:"Momentum", formula:"J = FΔt = Δp", ex:"冲量等于动量的变化。" },
  { zh:"动量守恒", py:"dòng liàng shǒu héng", en:"Conservation of Momentum", topic:"Momentum", formula:"p₁ + p₂ = const", ex:"系统不受外力时动量守恒。" },
  { zh:"碰撞", py:"pèng zhuàng", en:"Collision", topic:"Momentum", formula:"", ex:"碰撞分为弹性碰撞和非弹性碰撞。" },
  { zh:"弹性碰撞", py:"tán xìng pèng zhuàng", en:"Elastic Collision", topic:"Momentum", formula:"KE conserved", ex:"弹性碰撞中动能守恒。" },
  { zh:"非弹性碰撞", py:"fēi tán xìng pèng zhuàng", en:"Inelastic Collision", topic:"Momentum", formula:"KE not conserved", ex:"非弹性碰撞中动能不守恒。" },

const TOPICS = ["All", ...new Set(ALL_VOCAB.map(v => v.topic))];

let currentTopic = "All";
let deck = [];
let index = 0;
let isFlipped = false;
let knownSet = new Set();

function getFiltered() {
  return currentTopic === "All" ? ALL_VOCAB : ALL_VOCAB.filter(v => v.topic === currentTopic);
}

function buildDeck() {
  deck = [...getFiltered()];
  index = 0;
  isFlipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
  updateCard();
  updateStats();
}

function updateCard() {
  if (!deck.length) return;
  const v = deck[index];
  document.getElementById('cardTopic').textContent = v.topic;
  document.getElementById('cardTopicBack').textContent = v.topic;
  document.getElementById('cardNum').textContent = `${index+1}/${deck.length}`;
  document.getElementById('cardChinese').textContent = v.zh;
  document.getElementById('cardPinyin').textContent = v.py;
  document.getElementById('cardEnglish').textContent = v.en;
  document.getElementById('cardExample').textContent = v.ex;
  const formulaEl = document.getElementById('cardFormula');
  if (v.formula) {
    formulaEl.textContent = v.formula;
    formulaEl.style.display = 'block';
  } else {
    formulaEl.style.display = 'none';
  }
  // Progress
  const filtered = getFiltered();
  const knownInFiltered = filtered.filter(v => knownSet.has(v.zh)).length;
  const pct = filtered.length ? (knownInFiltered / filtered.length * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
}

function updateStats() {
  const filtered = getFiltered();
  const knownInFiltered = filtered.filter(v => knownSet.has(v.zh)).length;
  document.getElementById('totalCount').textContent = filtered.length;
  document.getElementById('knownCount').textContent = knownInFiltered;
  document.getElementById('unknownCount').textContent = filtered.length - knownInFiltered;
  document.getElementById('topicLabel').textContent = currentTopic;
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
}

function nextCard() {
  if (index < deck.length - 1) index++;
  else index = 0;
  isFlipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
  updateCard();
}

function prevCard() {
  if (index > 0) index--;
  else index = deck.length - 1;
  isFlipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
  updateCard();
}

function markKnown() {
  knownSet.add(deck[index].zh);
  updateStats();
  renderList();
  nextCard();
}

function markUnknown() {
  knownSet.delete(deck[index].zh);
  updateStats();
  renderList();
  nextCard();
}

function shuffleDeck() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  index = 0;
  isFlipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
  updateCard();
}

function buildTopicFilter() {
  const container = document.getElementById('topicFilter');
  TOPICS.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'topic-btn' + (t === 'All' ? ' active' : '');
    btn.textContent = t;
    btn.onclick = () => {
      document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTopic = t;
      buildDeck();
    };
    container.appendChild(btn);
  });
}

function renderList() {
  const container = document.getElementById('vocabList');
  container.innerHTML = '';
  const filtered = currentTopic === 'All' ? ALL_VOCAB : ALL_VOCAB.filter(v => v.topic === currentTopic);
  const grouped = {};
  filtered.forEach(v => {
    if (!grouped[v.topic]) grouped[v.topic] = [];
    grouped[v.topic].push(v);
  });
  Object.entries(grouped).forEach(([topic, words]) => {
    const title = document.createElement('div');
    title.className = 'vocab-section-title';
    title.textContent = topic;
    container.appendChild(title);
    words.forEach(v => {
      const row = document.createElement('div');
      row.className = 'vocab-row';
      row.innerHTML = `
        <div class="zh">${v.zh}</div>
        <div class="py">${v.py}</div>
        <div class="en">${v.en}</div>
        <div class="known-dot ${knownSet.has(v.zh) ? 'yes' : ''}"></div>
      `;
      container.appendChild(row);
    });
  });
}

function toggleList() {
  const list = document.getElementById('vocabList');
  const isVisible = list.classList.toggle('visible');
  document.querySelector('.btn-list').textContent = isVisible
    ? 'Hide Vocabulary List ↑'
    : 'Show Full Vocabulary List ↓';
  if (isVisible) renderList();
}

function renderFormulas() {
  const container = document.getElementById('formulaSheet');
  container.innerHTML = '';
  FORMULA_SHEET.forEach(section => {
    const block = document.createElement('div');
    block.className = 'formula-topic-block';
    block.innerHTML = `<div class="formula-topic-header">${section.topic}</div>`;
    const grid = document.createElement('div');
    grid.className = 'formula-grid';
    section.formulas.forEach(f => {
      const item = document.createElement('div');
      item.className = 'formula-item';
      item.innerHTML = `
        <div class="formula-name">${f.name}</div>
        <div class="formula-eq">${f.eq}</div>
        ${f.note ? `<div class="formula-note">${f.note}</div>` : ''}
      `;
      grid.appendChild(item);
    });
    block.appendChild(grid);
    container.appendChild(block);
  });
}

function toggleFormulas() {
  const sheet = document.getElementById('formulaSheet');
  const isVisible = sheet.classList.toggle('visible');
  document.querySelector('.btn-formula').textContent = isVisible
    ? 'Hide Formula Sheet ↑'
    : 'Show Formula Sheet ↓';
  if (isVisible) renderFormulas();
}
